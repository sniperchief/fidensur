name: CI

# Runs the whole verification story on clean machines.
#
# Two of these jobs do something a developer laptop cannot. `reproducible-build` builds the TEE
# image twice on two independently provisioned runners and requires the code hashes to be
# identical — that is the *cross-machine* determinism Fidensur's public-verifiability claim rests
# on, and building twice on one machine only ever proves the weaker same-machine version.
# `cross-implementation` re-derives the Solidity vectors and confirms the Go engine still matches
# them, so a drift between the two Merkle implementations fails here rather than in production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Contracts (Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report > gas-report.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-report
          path: gas-report.txt

  extension:
    name: Extension (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: extension/go.sum

      - name: Verify dependencies are pinned
        working-directory: extension
        # go.sum pins every dependency by hash. The measured code hash is only meaningful if the
        # inputs to the build are fixed, so an unverifiable module graph invalidates the whole
        # attestation argument.
        run: go mod verify

      - name: Vet
        working-directory: extension
        run: go vet ./...

      - name: Test
        working-directory: extension
        run: go test ./... -v

      - name: Race detector
        working-directory: extension
        # Handler invocations are serialized by the container contract, but the async COMPUTE path
        # runs on its own goroutine and touches the same state. That is exactly the shape of bug
        # -race exists to find.
        run: go test ./... -race

  identifier-sync:
    name: OPType/OPCommand sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check identifiers agree across all three layers
        # A drift compiles cleanly in both Solidity and Go and fails at runtime as an HTTP 501 from
        # inside a TEE. There is no other automated signal for it.
        run: bash scripts/check-op-sync.sh

  compose-valid:
    name: docker-compose resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every service's build context resolves
        # This exists because it did not, and a service was added referencing a Dockerfile that was
        # never written. Nothing caught it: the file is only touched by `docker compose up`, so the
        # failure would have surfaced on the deployment host rather than here.
        #
        # `config` resolves every service definition and build context without building or starting
        # anything, so it is seconds rather than minutes.
        run: docker compose config --quiet && echo "all services resolve"

      - name: Referenced files exist
        # `docker compose config` validates the compose syntax but does not check that each
        # `dockerfile:` actually exists on disk. Check that explicitly.
        run: |
          fail=0
          for f in $(grep -oE 'dockerfile: [^ ]+' docker-compose.yaml | awk '{print $2}'); do
            # Paths are relative to each service's build context, which is ./extension throughout.
            if [ -f "extension/$f" ]; then
              echo "  ok      extension/$f"
            else
              echo "  MISSING extension/$f"
              fail=1
            fi
          done
          exit $fail

  types-server-image:
    name: Types server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container

      - name: Build
        # The types server is not attested, so its code hash is not security-critical and this does
        # not need the two-machine digest comparison the extension image gets. What it does need is
        # to actually build — the sidecar is excluded from the extension image's dependency set, so
        # a missing package here would not show up in any other job.
        run: |
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --progress=plain \
            --build-arg SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            --provenance=false \
            -f extension/Dockerfile.types-server \
            -t fidensur-types-server:ci \
            ./extension

      - name: Confirm it serves and refuses to decrypt
        # The point of this service is what it will NOT do: encrypted payloads are reported as
        # shape, never unwrapped. A decoder that opened a policy would put confidential data on a
        # public endpoint, so assert the refusal rather than trusting the implementation.
        run: |
          docker run -d --name ts -p 8100:8100 fidensur-types-server:ci
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8100/health >/dev/null && break
            sleep 1
          done

          echo "--- /health ---"
          curl -sf http://localhost:8100/health || { docker logs ts; exit 1; }

          echo "--- /registry ---"
          curl -sf http://localhost:8100/registry || { docker logs ts; exit 1; }

          echo "--- COMPUTE message must report as encrypted, not decoded ---"
          BODY=$(curl -sf -X POST http://localhost:8100/decode \
            -H 'Content-Type: application/json' \
            -d '{"opType":"ALLOC","opCommand":"COMPUTE","kind":"message","data":"0xdeadbeef"}')
          echo "$BODY"

          echo "$BODY" | grep -q '"encrypted":true' || {
            echo "::error::COMPUTE message decoder did not report the payload as encrypted"
            docker logs ts
            exit 1
          }
          echo "ok — encrypted payloads are reported as shape only"

          docker rm -f ts

  cross-implementation:
    name: Go matches Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: extension/go.sum

      - name: Regenerate vectors from the Solidity implementation
        run: |
          forge test --match-test test_emitVectors -vv > /tmp/vectors.txt
          echo "--- Solidity output ---"
          cat /tmp/vectors.txt

      - name: Confirm the committed vectors still match Solidity
        # Catches a Solidity change that silently alters the leaf or node encoding. Without this,
        # the committed vectors could drift from the contract while the Go tests kept passing
        # against stale ground truth.
        run: |
          for hash in $(grep -oE '0x[0-9a-f]{64}' extension/internal/engine/testdata/merkle_vectors.json); do
            if ! grep -q "$hash" /tmp/vectors.txt; then
              echo "::error::committed vector $hash is no longer produced by the Solidity implementation"
              echo "Regenerate: forge test --match-test test_emitVectors -vv"
              exit 1
            fi
          done
          echo "All committed vectors still match the Solidity implementation."

      - name: Confirm the Go engine reproduces them
        working-directory: extension
        run: go test ./internal/engine/ -run 'MatchesSolidity' -v

  reproducible-build:
    name: Reproducible image (cross-machine)
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first failure cancels its sibling and the logs show one cancelled job and
      # one failed job — which hides whether the failure was deterministic or a one-off.
      fail-fast: false
      matrix:
        # Two independent runs. GitHub provisions a fresh VM for each job in the matrix, so these
        # are genuinely different machines — which is the property being tested.
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SOURCE_DATE_EPOCH comes from the commit timestamp

      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          # docker-container is what supports the OCI exporter and rewrite-timestamp. The classic
          # "docker" driver rejects both, and the build below targets this builder explicitly
          # rather than relying on it being the ambient default.
          driver: docker-container

      - name: Toolchain versions
        # rewrite-timestamp needs BuildKit >= 0.13. When an exporter option is unsupported the
        # error names the option but not the version that would provide it, so record both here
        # rather than inferring them from a failure later.
        run: |
          docker buildx version
          docker buildx inspect --bootstrap | grep -iE 'buildkit|driver' || true

      - name: Derive SOURCE_DATE_EPOCH from the commit
        id: epoch
        # Must come from the commit, never from the clock. A wall-clock timestamp would give every
        # build a different code hash, forcing TEE re-registration after every rebuild and making
        # the published hash unverifiable by anyone else.
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build the TEE image
        id: build
        # SOURCE_DATE_EPOCH must be in the *environment*, not only a --build-arg.
        #
        # The build arg is what the Dockerfile reads to clamp file mtimes. But BuildKit itself
        # reads the environment variable, and that is what makes it (a) stamp the image config's
        # `created` field deterministically instead of using wall-clock time, and (b) rewrite layer
        # timestamps. Without it the config differs on every build even when every layer is
        # byte-identical — which is exactly the mismatch this job caught.
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        # --progress=plain keeps the full build output in the log. The default renderer collapses
        # completed steps, so a failure deep in the build shows as a truncated summary.
        run: |
          # rewrite-timestamp=true is the load-bearing flag.
          #
          # SOURCE_DATE_EPOCH in the environment only makes BuildKit stamp the image *config*.
          # Normalizing the mtimes recorded in the layer tars requires this output option. Without
          # it, every layer we create carries build-time timestamps: a previous run of this job
          # showed the 13 base layers matching byte-for-byte while all three of our own layers
          # differed -- including the bare `WORKDIR /app` directory, which has no content that
          # could differ. That is metadata, not nondeterministic output.
          #
          # The OCI exporter is used rather than --load because it supports rewrite-timestamp and
          # because it yields a manifest digest directly, without a round trip through the local
          # daemon that could renormalize anything.
          #
          # `docker buildx build --builder <name>`, not plain `docker build`. Even with a
          # docker-container builder configured, `docker build` can still route to the classic
          # docker driver -- which rejects the OCI exporter outright ("OCI exporter is not
          # supported for the docker driver"). Naming the builder removes the ambiguity.
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --progress=plain \
            --build-arg SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }} \
            --provenance=false \
            --sbom=false \
            --output type=oci,dest=/tmp/image.tar,rewrite-timestamp=true \
            -t fidensur-extension:ci \
            ./extension

      - name: Record digest, layers, and created timestamp
        run: |
          mkdir -p /tmp/out /tmp/oci
          tar -xf /tmp/image.tar -C /tmp/oci

          blob() { echo "/tmp/oci/blobs/sha256/${1#sha256:}"; }

          # The manifest digest is the image digest -- what a registry serves it under, and the
          # thing a third party would compare against a published value. Hashing the exported
          # tarball instead would fold in tar member ordering and archive metadata, which can
          # differ between runs without the image differing: a false negative.
          MANIFEST=$(jq -r '.manifests[0].digest' /tmp/oci/index.json)
          echo "$MANIFEST" > /tmp/out/digest.txt

          jq -c '[.layers[].digest]' "$(blob "$MANIFEST")" > /tmp/out/layers.json

          CONFIG=$(jq -r '.config.digest' "$(blob "$MANIFEST")")
          jq -r '.created // "unset"' "$(blob "$CONFIG")" > /tmp/out/created.txt

          echo "--- image digest ---"; cat /tmp/out/digest.txt
          echo "--- layers ---";       cat /tmp/out/layers.json
          echo "--- created ---";      cat /tmp/out/created.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.attempt }}
          path: /tmp/out/

  compare-digests:
    name: Digests match across machines
    runs-on: ubuntu-latest
    needs: reproducible-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: /tmp/hashes

      - name: Compare
        # This is the assertion the whole verification story depends on. If two clean machines
        # building identical source produce different images, then "rebuild the published source
        # and check the hash matches" is not something a third party can actually do — and
        # Fidensur's central claim is false.
        run: |
          A=$(cat /tmp/hashes/hash-1/digest.txt)
          B=$(cat /tmp/hashes/hash-2/digest.txt)

          echo "image digest, machine 1: $A"
          echo "image digest, machine 2: $B"

          LA=$(cat /tmp/hashes/hash-1/layers.json)
          LB=$(cat /tmp/hashes/hash-2/layers.json)
          CA=$(cat /tmp/hashes/hash-1/created.txt)
          CB=$(cat /tmp/hashes/hash-2/created.txt)

          if [ "$A" = "$B" ]; then
            echo "Reproducible across machines: $A"
            exit 0
          fi

          echo "::error::Build is NOT reproducible across machines."
          echo ""

          # Separate the two failure modes, because they call for completely different fixes.
          if [ "$LA" = "$LB" ]; then
            echo "Layers are IDENTICAL, so the build itself is deterministic."
            echo "The difference is in the image config. Created timestamps:"
            echo "  machine 1: $CA"
            echo "  machine 2: $CB"
            echo "If those differ, SOURCE_DATE_EPOCH is not reaching BuildKit's environment."
          else
            echo "Layers DIFFER, so the build is genuinely nondeterministic."
            echo "  machine 1: $LA"
            echo "  machine 2: $LB"
            echo "Look for embedded timestamps, build paths, or unpinned dependencies."
          fi

          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        # verify.test.ts checks the browser-side signature verifier against vectors generated by
        # the Solidity implementation. The two are deliberately independent; this is where they
        # get compared.
        run: npx vitest run
