# Fidensur FCC stack.
#
# Three services, matching the topology every Flare FCC deployment uses:
#
#   extension-tee  your code plus tee-node, in one process (the Go single-process topology)
#   ext-proxy      watches the chain for instructions, delivers them, submits results back
#   redis          the proxy's queue
#
# The proxy's external API (container 6664 → host 6674) must be reachable from the internet for a
# real deployment; put an HTTPS tunnel in front of it and set EXT_PROXY_URL to the public URL
# *before* running pre-build, because pre-build, post-build and test all read it.
#
# Security: host port 6674 exposes the proxy HTTP API. Anyone with the URL can call it. Testnet
# only, and stop the tunnel when you are done.

# Memory limits on every service.
#
# These exist so this stack can share a host with something else — an agent, another app — without
# being able to starve it. Docker enforces them through cgroups: a container that reaches its limit
# is killed by the kernel *at its own boundary*, before global memory is exhausted. Nothing else on
# the machine is considered.
#
# Without limits the behaviour is quite different. Memory runs out globally and the OOM killer picks
# a victim, scoring largely by size — so the biggest process on the box can be killed by a spike it
# had nothing to do with. The limits make that impossible in this direction: Fidensur stops itself
# first, always.
#
# Total ceiling is 1152 MB. Sized for a ~2 GB host with another service already resident, and
# generous relative to actual use — the extension is a single static Go binary and redis holds a
# queue, not a dataset.
services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    # Configured with no persistence and mounted on tmpfs, so everything it holds is RAM. The limit
    # matters more here than it looks: if the enclave falls behind, the queue is what grows.
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    # Flare does not publish tee-proxy as an image — the scaffold builds it from source, which is
    # why `local/tee-proxy` resolves to nothing on a fresh host. CI builds it from proxy/Dockerfile
    # and publishes here so a small machine can pull rather than compile.
    image: ${FIDENSUR_PROXY_IMAGE:-ghcr.io/sniperchief/fidensur-tee-proxy}:${FIDENSUR_IMAGE_TAG:-latest}
    pull_policy: ${FIDENSUR_PULL_POLICY:-missing}
    build:
      context: ./proxy
      dockerfile: Dockerfile
      args:
        TEE_PROXY_VERSION: ${TEE_PROXY_VERSION:-v0.0.21}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    # The heaviest of the three in practice. Its initial sync pulls signing-policy history from the
    # indexer database, which is the most likely moment for a transient spike.
    mem_limit: ${PROXY_MEM_LIMIT:-384m}
    volumes:
      - ./config/proxy/extension_proxy.docker.toml:/app/config/config.toml:ro
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:?PROXY_PRIVATE_KEY must be set}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EXT_PROXY_INTERNAL_BIND:-0.0.0.0:6673}:6663"
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    # Prefer the image CI published. Building this locally compiles go-ethereum and needs roughly
    # 4 GB, which is more than a modest machine has — but the deeper reason is correctness: the CI
    # image is the one whose hash was reproduced on two independent runners, so running it means
    # running the artifact that was actually verified rather than a local rebuild that might differ.
    #
    # FIDENSUR_IMAGE_TAG should be a commit SHA in any real deployment. It names one exact commit,
    # so the running image and the source a verifier rebuilds are unambiguously the same thing;
    # `latest` is a moving target and cannot make that claim.
    #
    # `docker compose build` still works and falls back to building here, for developing the
    # extension itself on a machine with the memory for it.
    image: ${FIDENSUR_IMAGE:-ghcr.io/sniperchief/fidensur-extension}:${FIDENSUR_IMAGE_TAG:-latest}
    pull_policy: ${FIDENSUR_PULL_POLICY:-missing}
    # Holds every computed allocation table and its Merkle tree in enclave memory. A full
    # 4096-recipient round is well under a megabyte, so this ceiling is generous — it exists to
    # bound growth across a long-running process, not to constrain any single computation.
    mem_limit: ${EXTENSION_MEM_LIMIT:-512m}
    build:
      context: ./extension
      dockerfile: Dockerfile
      args:
        # Derived from the last commit by start-services.sh. Two builds of the same commit must
        # produce the same code hash, or the on-chain allowlist stops meaning anything.
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    env_file:
      # Written by pre-build.sh: EXTENSION_ID and INSTRUCTION_SENDER. Absent before the first
      # deploy, which is why it is optional.
      - path: ./config/extension.env
        required: false
    environment:
      # MODE=1 is simulated attestation. A real Confidential Space deploy needs MODE=0 *and*
      # SIMULATED_TEE=false; mismatching them fails with "code hashes do not match".
      - MODE=${MODE:-1}
      - SIMULATED_TEE=${SIMULATED_TEE:-true}

      # Chain id the node binds signatures to. Must match the proxy and the chain itself, because
      # it is inside the domain-separated payload the node signs — get it wrong and every
      # signature fails verification on-chain with no other symptom.
      # local devnet = 31337, coston = 16, coston2 = 114.
      - CHAIN_ID=${CHAIN_ID:-114}

      - INITIAL_OWNER=${INITIAL_OWNER:?INITIAL_OWNER must be set}

      # Governance signer set the node signs with. set-governance registers the same values
      # on-chain from the same variables, so the two cannot drift; if they do, TEE registration
      # reverts with InvalidGovernanceHash.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}

      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # FIDENSUR_CONTRACT is deliberately NOT listed here.
      #
      # It comes from config/extension.env via env_file above. Setting it here as
      # ${INSTRUCTION_SENDER:-} looked equivalent and was not: interpolation reads .env, which does
      # not define INSTRUCTION_SENDER, so it resolved to an empty string — and `environment:`
      # overrides `env_file:`, so the empty value won.
      #
      # The engine then refused to start, correctly: one that cannot tell which deployment it
      # serves cannot reject a policy encrypted for a different one. The failure was loud and
      # immediate, which is the right behaviour; the wiring was the bug.
    depends_on:
      - ext-proxy

  # Read-only sidecar that renders instruction and result bytes as JSON for the verification
  # explorer. Runs outside the enclave and holds no keys — it decodes only what is already public,
  # and reports encrypted payloads as shape rather than content.
  types-server:
    image: ${FIDENSUR_TYPES_IMAGE:-ghcr.io/sniperchief/fidensur-types-server}:${FIDENSUR_IMAGE_TAG:-latest}
    pull_policy: ${FIDENSUR_PULL_POLICY:-missing}
    # Stateless decoder — it holds nothing between requests.
    mem_limit: ${TYPES_SERVER_MEM_LIMIT:-128m}
    build:
      context: ./extension
      dockerfile: Dockerfile.types-server
    environment:
      - TYPES_SERVER_PORT=8100
    ports:
      - "${TYPES_SERVER_BIND:-127.0.0.1:8100}:8100"

networks:
  default:
    name: ${COMPOSE_NETWORK:-fidensur_default}
